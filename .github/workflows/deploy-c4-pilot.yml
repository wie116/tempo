name: Publish reviewed C4 pilot package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Reviewed c4-pilot-YYYYMMDD-12hex release tag
        required: true
        type: string
      archive_sha256:
        description: Exact approved SHA-256 of c4-pages.zip
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'wie116/tempo' && vars.TEMPO_PILOT_ACTIVE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Download and verify approved public static package
        env:
          C4_RELEASE_TAG: ${{ inputs.release_tag }}
          C4_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          C4_ARCHIVE: ${{ runner.temp }}/c4-pages.zip
          C4_UNPACK: ${{ runner.temp }}/c4-pages-reviewed
        shell: bash
        run: |
          set -euo pipefail
          [[ "$C4_RELEASE_TAG" =~ ^c4-pilot-[0-9]{8}-[a-f0-9]{12}$ ]]
          [[ "$C4_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            "https://github.com/wie116/tempo/releases/download/$C4_RELEASE_TAG/c4-pages.zip" -o "$C4_ARCHIVE"
          python3 .github/scripts/verify-c4-pages.py
          node --input-type=module <<'NODE'
          import{readFile}from'node:fs/promises';
          import{verifyRelease}from'./scripts/c4-release.mjs';
          const dir=process.env.C4_UNPACK,manifest=JSON.parse(await readFile(dir+'/release-manifest.json','utf8'));
          await verifyRelease(dir+'/site',manifest);
          const response=await fetch('https://api.github.com/repos/wie116/tempo/deployments?environment=github-pages&per_page=1',{headers:{'User-Agent':'Tempo-C4-Review'}});
          if(!response.ok)throw Error('Deployment inventory unavailable');
          const deployments=await response.json();
          if(deployments[0]?.sha!==manifest.legacyDeploymentSha)throw Error('Published baseline changed; prepare a new reviewed package');
          NODE
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/c4-pages-reviewed/site

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
